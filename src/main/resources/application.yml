spring:
  application:
    name: nubee-BE

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
    hikari:
      data-source-properties:
        sslMode: REQUIRED
        trustServerCertificate: false

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000
  refresh-expiration: 604800000

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  auth-url: https://kauth.kakao.com
  api-url: https://kapi.kakao.com

front:
  url: ${FRONT_URL}

server:
  port: 8082

llm:
  gateway:
    url: https://factchat-cloud.mindlogic.ai/v1/gateway/chat/completions # snowchat 활용 예정
    key: ${LLM_KEY} # 발급받은 API 키
    model: gemini-3.5-flash # 모델명은 학교 지원 범위 내에서 선택

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}  # 네이버에서 받은 Client ID
    client-secret: ${NAVER_CLIENT_SECRET} # 네이버에서 받은 Client Secret
    url: https://openapi.naver.com/v1/search/news.json
